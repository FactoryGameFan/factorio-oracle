[package]
name = "factorio-oracle"
version = "0.1.0"
edition = "2021"
description = "Ask a real Factorio install what it does, and record the answer with its provenance"
license = "MIT"
repository = "https://github.com/FactoryGameFan/factorio-oracle"

[lib]
name = "factorio_oracle"
path = "src/lib.rs"

[[bin]]
name = "factorio-oracle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Not a dev-dependency: `run` without --work-dir makes a fresh temporary
# directory, so the binary itself needs this.
tempfile = "3"
